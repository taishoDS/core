<nav
  class="ts pagination size-md"
  aria-label="Navegación de páginas"
  data-ts-pagination=""
  data-ts-total="20"
  data-ts-page="1"
  data-ts-items="200"
  data-ts-page-size="10"
  data-ts-label-template="{from}–{to} de {total}"
  data-ts-label-empty="0 resultados"
>
  <button
    type="button"
    disabled=""
    class="ts button size-sm variant-secondary shape-square is-icon-only pagination-btn"
    data-ts-page-prev=""
    aria-label="Página anterior"
  >
    <span data-ts-spinner=""><span class="ts spinner size-sm" aria-hidden="true"></span></span>
    <span data-ts-content="">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="ts icon icon-16"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
    </span>
  </button>
  <div data-ts-pagination-list="">
    <button
      type="button"
      class="ts button size-sm variant-secondary pagination-btn is-active"
      data-ts-page-item=""
      data-ts-value="1"
      aria-label="Página 1"
      aria-current="page"
    >
      <span data-ts-spinner=""><span class="ts spinner size-sm" aria-hidden="true"></span></span>
      <span data-ts-content=""> 1 </span></button
    ><button
      type="button"
      class="ts button size-sm variant-secondary pagination-btn"
      data-ts-page-item=""
      data-ts-value="2"
      aria-label="Página 2"
    >
      <span data-ts-spinner=""><span class="ts spinner size-sm" aria-hidden="true"></span></span>
      <span data-ts-content=""> 2 </span></button
    ><span class="ts pagination-ellipsis" aria-hidden="true" data-ts-page-ellipsis="">…</span
    ><button
      type="button"
      class="ts button size-sm variant-secondary pagination-btn"
      data-ts-page-item=""
      data-ts-value="20"
      aria-label="Página 20"
    >
      <span data-ts-spinner=""><span class="ts spinner size-sm" aria-hidden="true"></span></span>
      <span data-ts-content=""> 20 </span>
    </button>
  </div>
  <button
    type="button"
    class="ts button size-sm variant-secondary shape-square is-icon-only pagination-btn"
    data-ts-page-next=""
    aria-label="Página siguiente"
  >
    <span data-ts-spinner=""><span class="ts spinner size-sm" aria-hidden="true"></span></span>
    <span data-ts-content="">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="ts icon icon-16"
      >
        <path d="m9 18 6-6-6-6" />
      </svg>
    </span>
  </button>
</nav>
