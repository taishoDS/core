<div class="ts flex flex-col gap-base max-w-screen-sm">
  <div class="ts input-wrapper">
    <label for="ts-textarea-s1" class="ts input-label">Comentario</label>
    <div class="ts textarea size-md" data-ts-textarea="">
      <textarea
        id="ts-textarea-s1"
        rows="4"
        placeholder="Contanos qué te pareció"
        class="ts textarea-field"
      ></textarea>
      <div class="ts textarea-actions">
        <span class="ts textarea-spinner" data-ts-field-spinner="" hidden=""
          ><span class="ts spinner size-sm" role="status" aria-label="Cargando..."></span
        ></span>
      </div>
    </div>
  </div>
  <div class="ts input-wrapper">
    <label for="ts-textarea-s2" class="ts input-label">Nota del despliegue</label>
    <div class="ts textarea size-md has-clear" data-ts-textarea="">
      <textarea id="ts-textarea-s2" rows="3" class="ts textarea-field">
Despliegue completado.</textarea>
      <div class="ts textarea-actions">
        <span class="ts textarea-spinner" data-ts-field-spinner="" hidden=""
          ><span class="ts spinner size-sm" role="status" aria-label="Cargando..."></span
        ></span>
        <button
          type="button"
          class="ts button size-xs variant-tertiary shape-square is-icon-only textarea-clear"
          aria-label="Limpiar campo"
          data-ts-clear=""
        >
          <span data-ts-spinner=""
            ><span class="ts spinner size-sm" aria-hidden="true"></span
          ></span>
          <span data-ts-content="">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="ts icon icon-16"
            >
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </span>
        </button>
      </div>
    </div>
  </div>
  <div class="ts input-wrapper">
    <label for="ts-textarea-s3" class="ts input-label">Descripción del proyecto</label>
    <div class="ts textarea size-md has-clear is-loading" data-ts-textarea="">
      <textarea id="ts-textarea-s3" rows="2" class="ts textarea-field" aria-busy="true">
Panel de control</textarea>
      <div class="ts textarea-actions">
        <span class="ts textarea-spinner" data-ts-field-spinner=""
          ><span class="ts spinner size-sm" role="status" aria-label="Cargando..."></span
        ></span>
        <button
          type="button"
          class="ts button size-xs variant-tertiary shape-square is-icon-only textarea-clear"
          aria-label="Limpiar campo"
          data-ts-clear=""
        >
          <span data-ts-spinner=""
            ><span class="ts spinner size-sm" aria-hidden="true"></span
          ></span>
          <span data-ts-content="">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="ts icon icon-16"
            >
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </span>
        </button>
      </div>
    </div>
  </div>
  <div class="ts input-wrapper">
    <label for="ts-textarea-s4" class="ts input-label">Notas del release</label>
    <div class="ts textarea size-md resize-both" data-ts-textarea="">
      <textarea id="ts-textarea-s4" rows="2" class="ts textarea-field">
Nueva versión disponible.</textarea>
      <div class="ts textarea-actions">
        <span class="ts textarea-spinner" data-ts-field-spinner="" hidden=""
          ><span class="ts spinner size-sm" role="status" aria-label="Cargando..."></span
        ></span>
      </div>
    </div>
  </div>
  <div class="ts input-wrapper">
    <label for="ts-textarea-s5" class="ts input-label">Comentario del equipo</label>
    <div class="ts textarea size-md" data-ts-textarea="">
      <textarea
        id="ts-textarea-s5"
        rows="2"
        class="ts textarea-field"
        data-ts-debounce="200"
      ></textarea>
      <div class="ts textarea-actions">
        <span class="ts textarea-spinner" data-ts-field-spinner="" hidden=""
          ><span class="ts spinner size-sm" role="status" aria-label="Cargando..."></span
        ></span>
      </div>
    </div>
  </div>
</div>
