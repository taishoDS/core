<div class="ts flex flex-col gap-half">
  <label for="ts-toggle-s1" class="ts toggle size-md variant-primary is-checked"
    ><input
      type="checkbox"
      role="switch"
      aria-checked="true"
      id="ts-toggle-s1"
      checked=""
      class="ts toggle-input"
    />
    <div class="ts toggle-track">
      <div class="ts toggle-thumb">
        <span data-toggle-spinner="" aria-hidden="true"
          ><span class="ts spinner size-sm" role="status" aria-label="Cargando"></span
        ></span>
      </div>
    </div>
    <span class="ts toggle-label">Notificaciones</span></label
  >
  <label for="ts-toggle-s2" class="ts toggle size-md variant-primary"
    ><input
      type="checkbox"
      role="switch"
      aria-checked="false"
      id="ts-toggle-s2"
      class="ts toggle-input"
    />
    <div class="ts toggle-track">
      <div class="ts toggle-thumb">
        <span data-toggle-spinner="" aria-hidden="true"
          ><span class="ts spinner size-sm" role="status" aria-label="Cargando"></span
        ></span>
      </div>
    </div>
    <span class="ts toggle-label">Modo oscuro</span></label
  >
  <label for="ts-toggle-s3" class="ts toggle size-md variant-primary is-disabled"
    ><input
      type="checkbox"
      role="switch"
      aria-checked="false"
      id="ts-toggle-s3"
      disabled=""
      class="ts toggle-input"
    />
    <div class="ts toggle-track">
      <div class="ts toggle-thumb">
        <span data-toggle-spinner="" aria-hidden="true"
          ><span class="ts spinner size-sm" role="status" aria-label="Cargando"></span
        ></span>
      </div>
    </div>
    <span class="ts toggle-label">Dominio propio (plan Enterprise)</span></label
  >
</div>
