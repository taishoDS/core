version: 2
updates:
  # Las acciones de los workflows van fijadas por SHA: Dependabot propone el SHA nuevo con el comentario de versión.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
